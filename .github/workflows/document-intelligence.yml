name: Document Intelligence checks

on:
  push:
    paths:
      - "projects/enterprise-document-intelligence/**"
      - ".github/workflows/document-intelligence.yml"
  pull_request:
    paths:
      - "projects/enterprise-document-intelligence/**"
      - ".github/workflows/document-intelligence.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/enterprise-document-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/enterprise-document-intelligence/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Build Docker image
        run: docker build -t document-intelligence:ci .
