name: Attention Intelligence Prototype CI

on:
  push:
    paths:
      - "projects/enterprise-attention-intelligence-hub/**"
      - ".github/workflows/attention-intelligence.yml"
  pull_request:
    paths:
      - "projects/enterprise-attention-intelligence-hub/**"
      - ".github/workflows/attention-intelligence.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_KEY: ci-test-key
    defaults:
      run:
        working-directory: projects/enterprise-attention-intelligence-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/enterprise-attention-intelligence-hub/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Build Docker image
        run: docker build -t attention-intelligence:ci .
