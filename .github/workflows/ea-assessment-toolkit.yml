name: EA Assessment Toolkit Prototype CI

on:
  push:
    paths:
      - "projects/enterprise-architecture-assessment-toolkit/**"
      - ".github/workflows/ea-assessment-toolkit.yml"
  pull_request:
    paths:
      - "projects/enterprise-architecture-assessment-toolkit/**"
      - ".github/workflows/ea-assessment-toolkit.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_KEY: ci-test-key
    defaults:
      run:
        working-directory: projects/enterprise-architecture-assessment-toolkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/enterprise-architecture-assessment-toolkit/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Build Docker image
        run: docker build -t ea-assessment-toolkit:ci .
