name: Agent Operations Prototype CI

on:
  push:
    paths:
      - "projects/agent-driven-enterprise-operations/**"
      - ".github/workflows/agent-operations.yml"
  pull_request:
    paths:
      - "projects/agent-driven-enterprise-operations/**"
      - ".github/workflows/agent-operations.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/agent-driven-enterprise-operations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/agent-driven-enterprise-operations/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
