name: Pharma R&D Data Spine Prototype CI

on:
  push:
    paths:
      - "projects/pharma-rnd-data-spine/**"
      - ".github/workflows/pharma-rnd-spine.yml"
  pull_request:
    paths:
      - "projects/pharma-rnd-data-spine/**"
      - ".github/workflows/pharma-rnd-spine.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_KEY: ci-test-key
    defaults:
      run:
        working-directory: projects/pharma-rnd-data-spine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/pharma-rnd-data-spine/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Build Docker image
        run: docker build -t pharma-rnd-spine:ci .
