name: Life Sciences Supply Prototype CI

on:
  push:
    paths:
      - "projects/predictive-life-sciences-supply-chain/**"
      - ".github/workflows/life-sciences-supply.yml"
  pull_request:
    paths:
      - "projects/predictive-life-sciences-supply-chain/**"
      - ".github/workflows/life-sciences-supply.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_KEY: ci-test-key
    defaults:
      run:
        working-directory: projects/predictive-life-sciences-supply-chain
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/predictive-life-sciences-supply-chain/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Build Docker image
        run: docker build -t life-sciences-supply:ci .
