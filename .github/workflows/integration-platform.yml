name: Integration Platform Prototype CI

on:
  push:
    paths:
      - "projects/enterprise-integration-platform/**"
      - ".github/workflows/integration-platform.yml"
  pull_request:
    paths:
      - "projects/enterprise-integration-platform/**"
      - ".github/workflows/integration-platform.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/enterprise-integration-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/enterprise-integration-platform/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Build Docker image
        run: docker build -t integration-platform:ci .
