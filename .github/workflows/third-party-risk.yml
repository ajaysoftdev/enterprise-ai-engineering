name: Third-Party Risk Prototype CI

on:
  push:
    paths:
      - "projects/third-party-risk-management/**"
      - ".github/workflows/third-party-risk.yml"
  pull_request:
    paths:
      - "projects/third-party-risk-management/**"
      - ".github/workflows/third-party-risk.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_KEY: ci-test-key
    defaults:
      run:
        working-directory: projects/third-party-risk-management
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/third-party-risk-management/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Build Docker image
        run: docker build -t third-party-risk:ci .
