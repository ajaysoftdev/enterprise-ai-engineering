services:
  portfolio-integration:
    build: .
    ports:
      - "8003:8003"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in the project .env file}
      DOCINT_API_KEY: ${DOCINT_API_KEY:?Set DOCINT_API_KEY to the Document Intelligence API key}
      MDM_API_KEY: ${MDM_API_KEY:?Set MDM_API_KEY to the MDM API key}
      PORTFOLIO_INTEGRATION_DB: /app/data/portfolio-integration.db
      DOCINT_URL: ${DOCINT_URL:-http://host.docker.internal:8001}
      MDM_URL: ${MDM_URL:-http://host.docker.internal:8002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - portfolio-integration-data:/app/data
volumes:
  portfolio-integration-data:
