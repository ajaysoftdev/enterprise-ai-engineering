openapi: 3.1.0
info:
  title: Enterprise MDM and Data Governance
  version: 0.1.0
  description: Synthetic supplier source-record matching and human stewardship prototype.
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: Service health
      responses:
        "200":
          description: Healthy
  /v1/source-records:
    post:
      summary: Ingest a source master record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceRecordCreate"
      responses:
        "201":
          description: Source record accepted; may create a match candidate or golden record
        "409":
          description: Source system/key already exists
  /v1/match-candidates:
    get:
      summary: List match candidates
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, CONFIRMED, REJECTED]
      responses:
        "200":
          description: Candidate list
  /v1/match-candidates/{candidate_id}/decision:
    post:
      summary: Record a steward decision
      parameters:
        - in: path
          name: candidate_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StewardDecision"
      responses:
        "200":
          description: Decision recorded
        "404":
          description: Candidate not found
        "409":
          description: Candidate is not pending
  /v1/golden-records:
    get:
      summary: List golden records
      responses:
        "200":
          description: Golden record list
components:
  schemas:
    SourceRecordCreate:
      type: object
      required: [source_system, source_key, legal_name, tax_id]
      properties:
        source_system: {type: string, minLength: 2, maxLength: 80}
        source_key: {type: string, minLength: 1, maxLength: 120}
        legal_name: {type: string, minLength: 2, maxLength: 200}
        tax_id: {type: string, minLength: 4, maxLength: 40}
        email: {type: [string, "null"], maxLength: 254}
    StewardDecision:
      type: object
      required: [decision, steward]
      properties:
        decision: {type: string, enum: [CONFIRM_MATCH, REJECT_MATCH]}
        steward: {type: string, minLength: 2, maxLength: 120}
        note: {type: string, maxLength: 1000}
