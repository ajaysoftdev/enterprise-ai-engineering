[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-s4-data-modernisation"
version = "0.1.0"
description = "Synthetic SAP-like master-data mapping and migration reconciliation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.8,<3.0"]

[project.optional-dependencies]
dev = ["httpx2>=2.0.0", "pytest>=9.0.3,<10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
