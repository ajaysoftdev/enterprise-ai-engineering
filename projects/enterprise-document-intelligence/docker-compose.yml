services:
  document-intelligence:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in the project .env file}
      DOCUMENT_INTELLIGENCE_DB: /app/data/documents.db
    volumes:
      - document-data:/app/data
    read_only: true
    tmpfs:
      - /tmp

volumes:
  document-data:
