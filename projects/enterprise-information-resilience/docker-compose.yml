services:
  information-resilience:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in the project .env file}
      INFO_RESILIENCE_DB: /app/data/info-resilience.db
    volumes:
      - info-resilience-data:/app/data
volumes:
  info-resilience-data:
